name: Daily Market Scan

on:
  schedule:
    # GitHub cron is UTC and does NOT follow daylight saving, so we list both
    # offsets and let the "gate" job below run only the correct one each season.
    - cron: "30 21 * * 1-5"   # 21:30 UTC = 4:30pm Central during DST   (CDT, ~Mar–Nov)
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 4:30pm Central in standard  (CST, ~Nov–Mar)
  workflow_dispatch: {}        # manual "Run workflow" button (always runs)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  # Decide whether THIS trigger is the real 4:30pm-Central run for the season.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        name: Run only at 4:30pm Central (DST-aware)
        run: |
          go=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            go=true                                   # manual runs always proceed
          else
            tz=$(TZ=America/Chicago date +%Z)         # CDT or CST
            sched="${{ github.event.schedule }}"
            [ "$sched" = "30 21 * * 1-5" ] && [ "$tz" = "CDT" ] && go=true
            [ "$sched" = "30 22 * * 1-5" ] && [ "$tz" = "CST" ] && go=true
          fi
          echo "Central time now: $(TZ=America/Chicago date)  ->  go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  scan:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily scan
        run: python run_daily.py

      - name: Collect dashboards for Pages
        run: |
          mkdir -p public
          cp index.html ema_dashboard.html oversold_dashboard.html momentum_dashboard.html public/
          # publish the portfolio state so the next run can diff against it
          cp momentum_state.json public/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
